<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Start Shift - TMC</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="d-flex vh-100 justify-content-center align-items-center bg-light">
  <div class="text-center p-5 bg-white rounded shadow">
    <h4 class="mb-3">Please Start Your Shift</h4>
    <p class="text-muted">You must start your shift to access the portal.</p>
    <button id="btnGateStart" class="btn btn-primary btn-lg px-4">Start Shift</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    document.getElementById('btnGateStart').onclick = function(){
      this.disabled = true;
      axios.post('/users/shift/start', { branch_id: "{{ session_role_id or 1 }}" })
        .then(() => window.location.reload())
        .catch(() => { alert('Could not start shift. Try again.'); this.disabled=false; });
    };
  </script>
</body></html>
