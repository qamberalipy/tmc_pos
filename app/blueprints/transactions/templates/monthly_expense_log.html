{% extends "base.html" %}

{% block stylesheets %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
  /* --- Controls --- */
  .mel-controls {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
  }
  .mel-controls .left-group {
      display: flex;
      gap: 10px;
      align-items: end;
  }
  .mel-controls .right-group {
      display: flex;
      gap: 8px;
      align-items: center;
  }
  input[type="month"] { min-height: 42px; }

  /* --- Report Styling --- */
  #reportRoot { margin-top: 10px; }

  .mel-title {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 4px;
      text-transform: uppercase;
      color: #222;
  }
  .mel-subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 18px;
  }

  /* --- Summary Cards --- */
  .mel-summary-cards {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 22px;
  }
  .mel-card {
      flex: 1;
      min-width: 200px;
      border-radius: 10px;
      padding: 18px 20px;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .mel-card .label { font-size: 0.78rem; opacity: .85; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .mel-card .value { font-size: 1.55rem; font-weight: 700; }
  .mel-card-1 { background: linear-gradient(135deg, #6366f1, #818cf8); }
  .mel-card-2 { background: linear-gradient(135deg, #0ea5e9, #38bdf8); }
  .mel-card-3 { background: linear-gradient(135deg, #10b981, #34d399); }

  /* --- Head Breakdown --- */
  .mel-section-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 20px 0 8px;
      color: #333;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 4px;
  }
  .mel-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin-bottom: 16px;
  }
  .mel-table th {
      background: #f1f5f9;
      padding: 8px 10px;
      text-align: center;
      font-weight: 700;
      border: 1px solid #d1d5db;
      white-space: nowrap;
  }
  .mel-table td {
      padding: 7px 10px;
      border: 1px solid #d1d5db;
      text-align: center;
      vertical-align: middle;
  }
  .mel-table .text-end { text-align: right !important; }
  .mel-table .text-start { text-align: left !important; }

  /* --- Day Section --- */
  .mel-day-header {
      font-size: 0.92rem;
      font-weight: 700;
      margin: 18px 0 6px;
      color: #1e40af;
      display: flex;
      align-items: center;
      gap: 6px;
  }
  .mel-day-header i { font-size: 1rem; }

  /* Subtotal row */
  .mel-subtotal-row td {
      background: #fef3c7 !important;
      font-weight: 700;
      color: #92400e;
  }

  /* Grand total row */
  .mel-grand-total-row td {
      background: #1e3a5f !important;
      color: #fff !important;
      font-weight: 700;
      font-size: 0.95rem;
  }

  /* Empty state */
  .mel-empty {
      text-align: center;
      padding: 40px;
      color: #888;
      font-size: 1rem;
  }
</style>
{% endblock stylesheets %}

{% block content %}{% endblock %}

{% block user_page %}
<div class="container-fluid py-3 rounded bg-white shadow-sm border-0">

    <div class="mel-controls">
        <div class="left-group">
            <div>
                <label class="form-label small mb-1 fw-bold text-muted">Month</label>
                <input type="month" id="monthPicker" class="form-control">
            </div>
            <button class="btn btn-dark" id="searchBtn" title="Search">
                <i class="bi bi-search"></i> Search
            </button>
        </div>
        <div class="right-group">
            <button class="btn btn-danger btn-sm" id="btnPrintPdf">
                <i class="bi bi-file-earmark-pdf"></i> PDF
            </button>
            <button class="btn btn-success btn-sm" id="btnExportExcel">
                <i class="bi bi-file-earmark-excel"></i> Excel
            </button>
        </div>
    </div>

    <div id="reportRoot">
        <div class="mel-empty">
            <i class="bi bi-journal-text" style="font-size:2.5rem;"></i>
            <p class="mt-2">Select a month and click <strong>Search</strong> to generate the report.</p>
        </div>
    </div>

</div>
{% endblock %}

{% block javascript %}
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="{{ url_for('transactions.static', filename='js/monthly_expense_log.js') }}"></script>
{% endblock %}
